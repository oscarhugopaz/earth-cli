version: 2

project_name: earth-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: earth
    main: ./cmd/earth
    binary: earth
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/oscarhugopaz/earth-cli/internal/version.Version={{.Version}}
      - -X github.com/oscarhugopaz/earth-cli/internal/version.Commit={{.Commit}}
      - -X github.com/oscarhugopaz/earth-cli/internal/version.Date={{.CommitDate}}

archives:
  - id: earth
    ids:
      - earth
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: oscarhugopaz
    name: earth-cli
  draft: false
  prerelease: auto
